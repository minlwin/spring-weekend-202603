<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Components</title>
</head>
<body>

	<div th:fragment="pagination(pager, baseUrl)"
		class="d-flex justify-content-end mt-3">
		<nav aria-label="Pagination">
			<ul class="pagination mb-0">
				<li class="page-item" th:classappend="${pager.first} ? ' disabled'">
					<a class="page-link"
						th:href="${pager.first} ? '#' : @{${baseUrl}(page=${pager.page - 1}, size=${pager.size})}"
						th:attr="aria-disabled=${pager.first}, tabindex=${pager.first} ? -1 : null">
						Previous
					</a>
				</li>
				<li class="page-item" th:each="link : ${pager.links}" th:classappend="${link == pager.page} ? ' active'">
					<a class="page-link"
						th:if="${link != pager.page}"
						th:href="@{${baseUrl}(page=${link}, size=${pager.size})}"
						th:text="${link + 1}">1</a>
					<span class="page-link" th:if="${link == pager.page}" th:text="${link + 1}">1</span>
				</li>
				<li class="page-item" th:classappend="${pager.last} ? ' disabled'">
					<a class="page-link"
						th:href="${pager.last} ? '#' : @{${baseUrl}(page=${pager.page + 1}, size=${pager.size})}"
						th:attr="aria-disabled=${pager.last}, tabindex=${pager.last} ? -1 : null">
						Next
					</a>
				</li>
			</ul>
		</nav>
	</div>

</body>
</html>
