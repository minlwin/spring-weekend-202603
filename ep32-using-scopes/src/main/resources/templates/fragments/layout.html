<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Using Sessions</title>
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="bg-light">

	<nav class="navbar navbar-expand bg-secondary navbar-dark">
		<div class="container">
			<a th:href="@{/anonymous/welcome}" class="navbar-brand">
				<i class="bi-house-door me-1"></i> Shopping Card Demo
			</a>
			
			<ul sec:authorize="hasAuthority('Customer')" class="navbar-nav">

				<li class="nav-item" th:classappend="${cartCount eq 0 ? 'd-none' : ''}">
					<a href="#" class="nav-link">
						<i class="bi-cart3 me-1"></i> <span class="js-cart-count">[[${cartCount}]]</span>
					</a>
				</li>

				<li class="nav-item">
					<a href="#" id="logoutMenu" class="nav-link">
						<i class="bi-box-arrow-right me-1"></i> Sign Out
					</a>
				</li>
			</ul>

			<ul sec:authorize="hasAnyAuthority('Admin', 'Employee')" class="navbar-nav">

				<li class="nav-item">
					<a th:href="@{/management/invoices}" class="nav-link">
						<i class="bi-receipt me-1"></i> Invoices
					</a>
				</li>

				<li class="nav-item">
					<a th:href="@{/management/customers}" class="nav-link">
						<i class="bi-people me-1"></i> Customers
					</a>
				</li>

				<li class="nav-item">
					<a th:href="@{/management/employees}" class="nav-link">
						<i class="bi-person-badge me-1"></i> Employees
					</a>
				</li>

				<li class="nav-item">
					<a th:href="@{/management/products}" class="nav-link">
						<i class="bi-box-seam me-1"></i> Products
					</a>
				</li>

				<li class="nav-item">
					<a href="#" id="logoutMenu" class="nav-link">
						<i class="bi-box-arrow-right me-1"></i> Sign Out
					</a>
				</li>
			</ul>

			<ul sec:authorize="isAnonymous()" class="navbar-nav">

				<li class="nav-item" th:classappend="${cartCount eq 0 ? 'd-none' : ''}">
					<a th:href="@{/anonymous/cart}" class="nav-link">
						<i class="bi-cart3 me-1"></i> <span class="js-cart-count">[[${cartCount}]]</span>
					</a>
				</li>

				<li class="nav-item">
					<a th:href="@{/auth/signin}" class="nav-link">
						<i class="bi-box-arrow-in-right me-1"></i> Sign In
					</a>
				</li>
			</ul>
		</div>
	</nav>
	
	<div th:insert="${content}" class="container my-4"></div>
	
	<form id="logoutForm" th:action="@{/logout}" method="post"></form>
	
	<script sec:authorize="isAuthenticated()" th:src="@{/js/logout.js}"></script>
		
</body>
</html>
