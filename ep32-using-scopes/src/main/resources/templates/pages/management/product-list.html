<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
<title>Product Management</title>
</head>
<body>
	<main>
		<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
			<div>
				<div class="text-uppercase small fw-semibold text-secondary mb-1">Management</div>
				<h1 class="h3 mb-1">Products</h1>
				<p class="text-secondary mb-0">Search catalog items and upload product data files.</p>
			</div>
		</div>

		<div class="mb-4">
			<div class="card shadow-sm border-0 h-100">
				<div class="card-body">
					<form th:action="@{/management/products}" th:object="${productSearch}" method="get" class="row g-3 align-items-end">
						<div class="col-12 col-md-4">
							<label for="categoryId" class="form-label">Category</label>
							<select th:field="*{categoryId}" class="form-select">
								<option value="">Search All</option>
								<option th:each="item : ${categories}" th:value="${item.id}">[[${item.name}]]</option>
							</select>
						</div>
						<div class="col-12 col-md-5">
							<label for="keyword" class="form-label">Keyword</label>
							<input id="keyword" name="keyword" type="search" class="form-control"
								placeholder="Product name or description"
								th:field="*{keyword}">
						</div>
						<div class="col-12 col-md-3 d-flex gap-2 flex-wrap">
							<button type="submit" class="btn btn-secondary">
								<i class="bi bi-search me-1"></i>Search
							</button>
							<button type="button" id="uploadBtn" class="btn btn-outline-secondary">
								<i class="bi bi-cloud-arrow-up me-1"></i>Upload file
							</button>
						</div>
					</form>
				</div>
			</div>		
		</div>

		<div class="card shadow-sm border-0">
			<div class="card-body">
				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<div class="text-secondary small">
						Showing <span th:text="${#lists.size(result.contents)}">0</span>
						of <span th:text="${result.pager.count}">0</span> products
					</div>
					<div class="text-secondary small" th:text="|Page ${result.pager.page + 1}|">Page 1</div>
				</div>

				<div class="table-responsive" th:if="${!#lists.isEmpty(result.contents)}">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th scope="col">Name</th>
								<th scope="col">Description</th>
								<th scope="col" class="text-end">Price</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${result.contents}">
								<td class="fw-semibold" th:text="${item.name}">Product name</td>
								<td class="text-secondary" th:text="${item.description}">Product description</td>
								<td class="text-end fw-semibold text-danger" th:text="|MMK ${item.price}|">MMK 0</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="alert alert-light border text-secondary mb-0" th:if="${#lists.isEmpty(result.contents)}">
					No products match the current filters.
				</div>

				<div th:replace="~{/fragments/components :: pagination(pager=${result.pager}, baseUrl=@{/management/products(categoryId=${param.categoryId != null ? param.categoryId[0] : null}, keyword=${param.keyword != null ? param.keyword[0] : null})})}"></div>
			</div>
		</div>
		
		<form id="uploadForm" th:action="@{/management/products}" method="post" enctype="multipart/form-data" class="d-none">
			<input type="file" name="file" />
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		</form>
		
		<script th:src="@{/js/product-upload.js}"></script>
	</main>
</body>
</html>
