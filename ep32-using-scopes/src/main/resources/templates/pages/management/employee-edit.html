<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
<title>Create Employee</title>
</head>
<body>
	<main>
		<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
			<div>
				<div class="text-uppercase small fw-semibold text-secondary mb-1">Management</div>
				<h1 class="h3 mb-1">Create Employee</h1>
				<p class="text-secondary mb-0">Register a new employee account for internal access.</p>
			</div>
			<a th:href="@{/management/employees}" class="btn btn-outline-secondary">
				<i class="bi bi-arrow-left me-1"></i>Back to list
			</a>
		</div>

		<div class="row justify-content-center">
			<div class="col-12 col-lg-8 col-xl-6">
				<div class="card shadow-sm border-0">
					<div class="card-body p-4 p-lg-5">
						<form th:action="@{/management/employees/edit}" th:object="${employeeForm}" method="post" class="d-grid gap-3">
							<div>
								<label for="name" class="form-label">Name</label>
								<input id="name" type="text" class="form-control form-control-lg"
									th:field="*{name}"
									th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
								<div class="invalid-feedback" th:errors="*{name}">Enter employee name.</div>
							</div>

							<div>
								<label for="phone" class="form-label">Phone</label>
								<input id="phone" type="tel" class="form-control form-control-lg"
									th:field="*{phone}"
									th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
								<div class="invalid-feedback" th:errors="*{phone}">Enter phone number.</div>
							</div>

							<div>
								<label for="email" class="form-label">Email</label>
								<input id="email" type="email" class="form-control form-control-lg"
									th:field="*{email}"
									th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
								<div class="invalid-feedback" th:errors="*{email}">Enter email address.</div>
							</div>

							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

							<div class="d-flex justify-content-end gap-2 pt-2">
								<a th:href="@{/management/employees}" class="btn btn-outline-secondary">
									Cancel
								</a>
								<button type="submit" class="btn btn-primary">
									<i class="bi bi-check2-circle me-1"></i>Save employee
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
