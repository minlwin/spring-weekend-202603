<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
<title>Online Store</title>
</head>
<body>
	<main>
		<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
			<div>
				<h1 class="h3 mb-1">Product catalog</h1>
				<p class="text-secondary mb-0">Browse products, filter by category, and keep items in the current session.</p>
			</div>
			<div class="text-secondary small">
				<span class="fw-semibold" th:text="${result.pager.count}">0</span> products available
			</div>
		</div>

		<div class="row g-4">
			<div class="col-12 col-lg-3">
				<div class="card shadow-sm border-0 mb-4">
					<div class="card-body">
						<div class="d-flex justify-content-between align-items-center mb-3">
							<h2 class="h6 mb-0">Categories</h2>
							<a th:href="@{/anonymous/welcome}" class="link-secondary small text-decoration-none">All</a>
						</div>
						<div class="list-group list-group-flush">
							<a th:href="@{/anonymous/welcome(keyword=${param.keyword != null ? param.keyword[0] : null}, size=${param.size != null ? param.size[0] : 12})}"
								class="list-group-item list-group-item-action"
								th:classappend="${param.category == null} ? ' active' : ''">
								All categories
							</a>
							<a th:each="item, iterStat : ${categories}"
								th:href="@{/anonymous/welcome(category=${item.name}, keyword=${param.keyword != null ? param.keyword[0] : null}, size=${param.size != null ? param.size[0] : 12})}"
								th:class="|list-group-item list-group-item-action ${(param.category != null and param.category[0] == item.name) ? 'active' : (iterStat.index >= 10 ? 'd-none extra-category' : '')}|"
								th:text="${item.name}">
								Category
							</a>
						</div>
						<button th:if="${#lists.size(categories) > 10}"
							type="button"
							class="btn btn-link btn-sm p-0 mt-2 text-secondary text-decoration-none js-show-more-categories">
							<i class="bi bi-chevron-down me-1"></i>Show more
						</button>
					</div>
				</div>

			</div>

			<div class="col-12 col-lg-9">
				<div class="card shadow-sm border-0 mb-4">
					<div class="card-body">
						<form th:action="@{/anonymous/welcome}" method="get" class="row g-3 align-items-end">
							<input type="hidden" name="page" value="0">
							<input type="hidden" name="size" value="12">
							<input type="hidden" name="category" th:value="${param.category != null ? param.category[0] : ''}">
							<div class="col-12 col-md-6">
								<label for="keyword" class="form-label">Keyword</label>
								<input id="keyword" name="keyword" type="search" class="form-control"
									placeholder="Search product name or description"
									th:value="${param.keyword != null ? param.keyword[0] : ''}">
							</div>
							<div class="col-12 col-md-3 d-flex gap-2 flex-wrap">
								<button type="submit" class="btn btn-primary">
									<i class="bi bi-search me-1"></i>Search
								</button>
							</div>
						</form>
					</div>
				</div>

				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<div class="text-secondary small">
						Showing <span th:text="${#lists.size(result.contents)}">0</span>
						of <span th:text="${result.pager.count}">0</span> products
					</div>
					<div class="text-secondary small" th:text="|Page ${result.pager.page + 1}|">Page 1</div>
				</div>

				<div class="row g-3" th:if="${!#lists.isEmpty(result.contents)}">
					<div class="col-12 col-md-6 col-xl-4" th:each="item : ${result.contents}">
						<div class="card h-100 shadow-sm">
							<div class="card-body d-flex flex-column">
								<div class="d-flex justify-content-between align-items-start gap-2 mb-3">
									<h3 class="h6 card-title mb-0" th:text="${item.name}">Product name</h3>
								</div>
								<p class="card-text text-secondary flex-grow-1 mb-4" th:text="${item.description}">
									Product description
								</p>
								<div class="d-flex justify-content-between align-items-center gap-3 mt-auto">
									<div>
										<div class="fw-semibold text-danger" th:text="|MMK ${item.price}|">MMK 0</div>
									</div>
									<button sec:authorize="isAnonymous() or hasAuthority('Customer')"
										type="button"
										class="btn btn-primary js-add-to-cart"
										th:attr="data-endpoint=@{/anonymous/cart/add/{id}(id=${item.id})}">
										Add to cart
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="alert alert-light border text-secondary mb-0" th:if="${#lists.isEmpty(result.contents)}">
					No products match the current filters.
				</div>

				<div th:replace="~{/fragments/components :: pagination(pager=${result.pager}, baseUrl=@{/anonymous/welcome(category=${param.category != null ? param.category[0] : null}, keyword=${param.keyword != null ? param.keyword[0] : null})})}"></div>
			</div>
		</div>
		
		<script th:src="@{/js/welcome.js}"></script>
	</main>


</body>
</html>
