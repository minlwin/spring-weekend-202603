<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
<title>My Invoices</title>
</head>
<body>
	<main>
		<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
			<div>
				<h1 class="h3 mb-1">My Invoices</h1>
				<p class="text-secondary mb-0">View and track your order history.</p>
			</div>
		</div>

		<div class="card shadow-sm border-0 mb-4">
			<div class="card-body">
				<form th:action="@{/member/invoice}" method="get" class="row g-3 align-items-end">
					<div class="col-12 col-md-2">
						<label for="status" class="form-label">Status</label>
						<select id="status" name="status" class="form-select">
							<option value="">All</option>
							<option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"
								th:selected="${param.status != null and param.status[0] == s.name()}">Invoiced</option>
						</select>
					</div>
					<div class="col-12 col-md-3">
						<label for="from" class="form-label">From</label>
						<input id="from" name="from" type="date" class="form-control"
							th:value="${param.from != null ? param.from[0] : ''}">
					</div>
					<div class="col-12 col-md-3">
						<label for="to" class="form-label">To</label>
						<input id="to" name="to" type="date" class="form-control"
							th:value="${param.to != null ? param.to[0] : ''}">
					</div>
					<div class="col-12 col-md-2">
						<button type="submit" class="btn btn-secondary">
							<i class="bi bi-search me-1"></i>Search
						</button>
					</div>
				</form>
			</div>
		</div>

		<div class="card shadow-sm border-0">
			<div class="card-body">
				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<div class="text-secondary small">
						Showing <span th:text="${#lists.size(result.contents)}">0</span>
						of <span th:text="${result.pager.count}">0</span> invoices
					</div>
					<div class="text-secondary small" th:text="|Page ${result.pager.page + 1}|">Page 1</div>
				</div>

				<div class="table-responsive" th:if="${!#lists.isEmpty(result.contents)}">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th scope="col">Invoice At</th>
								<th scope="col">Status</th>
								<th scope="col" class="text-end">Items</th>
								<th scope="col" class="text-end">Total</th>
								<th scope="col"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${result.contents}">
								<td th:text="${#temporals.format(item.invoiceAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
								<td>
									<span th:switch="${item.status.name()}">
										<span th:case="'Invoiced'" class="badge text-bg-primary" th:text="${item.status}">Invoiced</span>
										<span th:case="'Delivered'" class="badge text-bg-info" th:text="${item.status}">Delivered</span>
										<span th:case="'Canceled'" class="badge text-bg-danger" th:text="${item.status}">Canceled</span>
										<span th:case="'Finished'" class="badge text-bg-success" th:text="${item.status}">Finished</span>
										<span th:case="*" class="badge text-bg-secondary" th:text="${item.status}">Unknown</span>
									</span>
								</td>
								<td class="text-end" th:text="${item.totalItems}">0</td>
								<td class="text-end fw-semibold" th:text="${#numbers.formatInteger(item.totalAmount, 1, 'COMMA')}">0</td>
								<td class="text-end">
									<a th:href="@{/member/invoice/{id}(id=${item.id})}" class="btn btn-sm btn-outline-secondary">
										<i class="bi bi-eye me-1"></i>View
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="alert alert-light border text-secondary mb-0" th:if="${#lists.isEmpty(result.contents)}">
					No invoices found.
				</div>

				<div th:replace="~{/fragments/components :: pagination(pager=${result.pager}, baseUrl=@{/member/invoice(status=${param.status != null ? param.status[0] : null}, from=${param.from != null ? param.from[0] : null}, to=${param.to != null ? param.to[0] : null})})}"></div>
			</div>
		</div>
	</main>
</body>
</html>
