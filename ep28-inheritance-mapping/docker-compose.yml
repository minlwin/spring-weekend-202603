volumes:
  db_data:
    driver: local

services:
  db:
    image: mysql:9.6
    container_name: mysql_db
    environment:
      - MYSQL_DATABASE=mydb
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
