<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>User Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/styles/application.css}" />

</head>
<body>

	<nav class="navbar navbar-expand navbar-dark bg-primary">
		<div class="container">
			<a th:href="@{/}" class="navbar-brand">
				<i class="bi-house"></i> User Details Service
			</a>
			
			<ul class="navbar-nav">
				
				<li sec:authorize="hasRole('Admin')" class="nav-item">
					<a th:href="@{/admin}" class="nav-link">
						<i class="bi-bar-chart"></i> Admin Home
					</a>
				</li>
				
				<li sec:authorize="hasRole('Admin')" class="nav-item">
					<a th:href="@{/admin/members}" class="nav-link">
						<i class="bi-people"></i> Member Management
					</a>
				</li>
				
				<li sec:authorize="hasRole('Member')" class="nav-item">
					<a th:href="@{/member/profile}" class="nav-link">
						<i class="bi-person"></i> Profile
					</a>
				</li>

				<li sec:authorize="hasRole('Member')" class="nav-item">
					<a th:href="@{/member/access}" class="nav-link">
						<i class="bi-shield"></i> Access History
					</a>
				</li>

				<li sec:authorize="isAuthenticated()" class="nav-item">
					<a id="logoutMenu" href="#" class="nav-link">
						<i class="bi-door-closed"></i> Logout
					</a>
				</li>
				
				<li sec:authorize="isAnonymous()" class="nav-item">
					<a th:href="@{/login}" class="nav-link">
						<i class="bi-door-open"></i> Login
					</a>
				</li>
			</ul>
		</div>
	</nav>
	
	<div class="container mt-3" th:insert="${contents}"></div>
	
	<section sec:authorize="isAuthenticated()">
		<form id="logoutForm" th:action="@{/logout}" method="post"></form>
		<script type="text/javascript" th:src="@{/js/logout.js}"></script>
	</section>

</body>
</html>
