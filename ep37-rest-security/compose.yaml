volumes:
  database-vm:
services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: productdb
    environment:
      - 'POSTGRES_DB=productdb'
      - 'POSTGRES_PASSWORD=p@ssw0rd'
      - 'POSTGRES_USER=productdb'
    ports:
      - '5432'
    volumes:
      - database-vm:/var/lib/postgresql

  mailhog:
    image: 'mailhog/mailhog'
    container_name: mailhog
    ports:
      - '8025:8025'
      - '1025:1025'
