<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cookie Value</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

	<div class="container mt-4">
		<h1>Using Cookies</h1>
		
		<div class="w-50 row row-cols-2">
			<div class="col">Access Count</div>
			<div class="col">[[${count}]]</div>
			
			<div class="col">Message</div>
			<div class="col" th:text="${message}"></div>
		</div>
		
		<div class="mt-4">
			<a th:href="@{/}" class="btn btn-primary">Home</a>
			<a th:href="@{/access}" class="btn btn-primary">Reload</a>
		</div>
	</div>

</body>
</html>
