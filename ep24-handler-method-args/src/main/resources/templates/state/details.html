<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>State Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

	<div class="container mt-4">
		<h1>State Details</h1>
		
		<div class="row row-cols-2 w-50">
			<div class="col">Name</div>
			<div class="col">[[${state.name}]]</div>
			<div class="col">Capital</div>
			<div class="col">[[${state.capital}]]</div>
			<div class="col">Population</div>
			<div class="col">[[${state.population}]]</div>
		</div>
		
		<div class="mt-4">
			<a th:href="@{/state}" class="btn btn-primary">State List</a>
		</div>
	</div>

</body>
</html>
