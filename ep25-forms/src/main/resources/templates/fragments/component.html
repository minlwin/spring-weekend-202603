<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Components</title>
</head>
<body>

	<div th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary">
		<nav class="container">
			<a th:href="@{/}" class="navbar-brand">
				<i class="bi-house"></i> Forms
			</a>
			
			<ul class="navbar-nav">
				<li class="nav-item">
					<a th:href="@{/registrations}" class="nav-link"  th:classappend="${title eq 'Registrations'} ? 'active' : ''">Registrations</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/students}" class="nav-link"  th:classappend="${title eq 'Students'} ? 'active' : ''">Students</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/classes}" class="nav-link" th:classappend="${title eq 'Classes'} ? 'active' : ''">Classes</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/courses}" class="nav-link" th:classappend="${title eq 'Courses'} ? 'active' : ''">Courses</a>
				</li>
			</ul>
		</nav>
	</div>
	

</body>
</html>
