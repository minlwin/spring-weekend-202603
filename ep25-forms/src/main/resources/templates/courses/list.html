<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
</head>
<body>
	
	<main>
		<!-- Page Title -->
		<h3>Course Management</h3>
		
		<!-- Search Form -->
		<form class="d-flex align-items-end gap-3 mb-3">
			<div th:replace="~{/fragments/component :: formGroup('Level', ~{::levelSelect})}" >
				<select th:fragment="levelSelect" name="level" class="form-select">
					<option value="">Search All</option>
				</select>
			</div>
			<div th:replace="~{/fragments/component :: formGroup('Course Name', ~{::nameInput})}" >
				<input th:fragment="nameInput" type="text" name="keyword" placeholder="Search Name" class="form-control" />
			</div>
			<div>
				<button type="submit" class="btn btn-primary">
					<i class="bi-search"></i> Search
				</button>
				
				<a th:href="@{/courses/create}" class="btn btn-danger">
					<i class="bi-plus"></i> Add New
				</a>
			</div>
		</form>
		
		<!-- Result Table -->
		<table class="table table-striped">
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Level</th>
					<th>Articles</th>
					<th>Hours</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>1</td>
					<td>Java Basic</td>
					<td>Basic</td>
					<td>8</td>
					<td>120</td>
					<td>
						<a href="#" class="btn-link">
							<i class="bi-arrow-right"></i>
						</a>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
