<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
</head>
<body>
	
	<main>
		<h3 th:text="${id == null ? 'Create Course' : 'Edit Course'}">Course Edit</h3>
		
		<form th:action="@{/courses/edit}" th:object="${courseForm}" method="post">
			<input type="hidden" name="id" th:value="${id}" />
			<div class="row mb-3">
				<!-- Name -->
				<div class="col-6">
					<label class="d-block mb-1">Course Name</label>
					<input th:field="*{name}" type="text" class="form-control" placeholder="Enter Course Name" />
					<span th:errors="*{name}"></span>
				</div>
			</div>
			
			<div class="row mb-3">
				<!-- Level -->
				<div class="col-3">
					<label class="d-block mb-1">Course Level</label>
					<select th:field="*{level}" class="form-select">
						<option value="">Select One</option>
						<option th:each="item : ${levels}" th:value="${item}">[[${item}]]</option>
					</select>
					<span th:errors="*{level}"></span>
				</div>
				
				<!-- Hours -->
				<div class="col-3">
					<label class="d-block mb-1">Hours</label>
					<input th:field="*{hours}" type="number" class="form-control" placeholder="Enter Course Hours" />
					<span th:errors="*{hours}"></span>
				</div>
			</div>
			
			<!-- Description -->
			<div class="mb-3">
				<label class="d-block mb-1">Description</label>
				<textarea th:field="*{description}" th:fragment="description" class="form-control"></textarea>
			</div>
			
			<div>
				<button type="submit" class="btn btn-primary">
					<i class="bi-save"></i> Save
				</button>
			</div>
			
		</form>
	</main>
</body>
</html>
