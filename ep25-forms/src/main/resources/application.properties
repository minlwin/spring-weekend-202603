spring.application.name=ep25-forms

spring.datasource.url=jdbc:mysql://localhost:3306/mydb
spring.datasource.username=myuser
spring.datasource.password=mypassword

app.sql.course.insert=insert into COURSE(name, level, hours, description) \
	values (:name, :level, :hours, :description)	
app.sql.course.find-by-id=select * from COURSE where id = :id
app.sql.course.search=select id, name, level, hours from COURSE where 1 = 1
app.sql.course.update=update COURSE set name = :name, level = :level, hours = :hours, description = :description where id = :id