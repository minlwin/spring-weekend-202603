<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Components</title>
</head>
<body>

	<div th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary">
		<nav class="container">
			<a th:href="@{/}" class="navbar-brand">
				<i class="bi-house"></i> Forms
			</a>
			
			<ul class="navbar-nav">
				<li class="nav-item">
					<a th:href="@{/registrations}" class="nav-link"  th:classappend="${title eq 'Registrations'} ? 'active' : ''">Registrations</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/students}" class="nav-link"  th:classappend="${title eq 'Students'} ? 'active' : ''">Students</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/classes}" class="nav-link" th:classappend="${title eq 'Classes'} ? 'active' : ''">Classes</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/courses}" class="nav-link" th:classappend="${title eq 'Courses'} ? 'active' : ''">Courses</a>
				</li>
			</ul>
		</nav>
	</div>
	
	<div th:fragment="nodata(name)" class="card">
		<div class="card-body">
			<h4 class="card-title">No Data</h4>
			<p>There is no [[${name}]].</p>
		</div>
	</div>
	
	
	<div th:fragment="info(label, value, icon)" class="card">
		<div class="card-body">
			<div class="d-flex gap-4">
				<div class="d-flex justify-content-center align-items-center">
					<i th:classappend="${icon}" class="fs-3"></i>
				</div>
				
				<div>
					<div class="text-secondary">[[${label}]]</div>
					<div class="fs-5 ">[[${value}]]</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
