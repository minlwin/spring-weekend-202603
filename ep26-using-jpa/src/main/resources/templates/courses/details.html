<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
</head>
<body>

	<main th:object="${details}">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h3 class="mb-0">Course Details</h3>
			<a th:href="@{/courses}" class="btn btn-outline-secondary">
				<i class="bi-arrow-left"></i> Back
			</a>
		</div>

		<div class="card mb-3">
			<div class="card-body">
				<h5 class="card-title"><i class="bi-book"></i> Course Information</h5>
				<dl class="row mb-0">
					<dt class="col-sm-3 text-secondary">Course ID</dt>
					<dd class="col-sm-9">[[*{id}]]</dd>
					<dt class="col-sm-3 text-secondary">Course Name</dt>
					<dd class="col-sm-9">[[*{name}]]</dd>
					<dt class="col-sm-3 text-secondary">Level</dt>
					<dd class="col-sm-9"><span class="badge bg-primary">[[*{level}]]</span></dd>
					<dt class="col-sm-3 text-secondary">Hours</dt>
					<dd class="col-sm-9">[[*{hours}]] Hours</dd>
					<dt class="col-sm-3 text-secondary">Description</dt>
					<dd class="col-sm-9 mb-0">[[*{description}]]</dd>
				</dl>
			</div>
		</div>

		<a th:href="@{|/courses/edit/*{id}|}" class="btn btn-primary">
			<i class="bi-pencil"></i> Edit Course
		</a>
	</main>

</body>
</html>
