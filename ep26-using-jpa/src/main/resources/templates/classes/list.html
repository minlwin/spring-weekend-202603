<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
</head>
<body>
	
	<main>
		<h3>Class Management</h3>
		
		<!-- Search Form -->
		<form class="d-flex align-items-end gap-3 mb-3" th:object="${classesSearch}">
			<!-- Courses -->
			<div>
				<label class="d-block mb-1">Course</label>
				<select class="form-select" th:field="*{courseId}">
					<option value="">Search All</option>
					<option th:each="item : ${courses}" th:value="${item.id}">[[${item.name}]]</option>
				</select>
			</div>
			
			<!-- Status -->
			<div>
				<label class="d-block mb-1">Status</label>
				<select th:field="*{status}" class="form-select">
					<option value="">Search All</option>
					<option th:each="item : ${statuses}" th:value="${item}">[[${item}]]</option>
				</select>
			</div>
			
			<!-- Date From -->
			<div>
				<label class="d-block mb-1">Start From</label>
				<input th:field="*{startFrom}" type="date" class="form-control" />
			</div>
			
			<!-- Buttons -->
			<div>
				<button type="submit" class="btn btn-primary">
					<i class="bi-search"></i> Search
				</button>
				
				<a th:href="@{/classes/edit}" class="btn btn-danger">
					<i class="bi-plus"></i> Create Class
				</a>
			</div>
		</form>
		
		<!-- Result Table -->
		<table th:unless="${#lists.isEmpty(list)}" class="table table-striped">
			<thead>
				<tr>
					<th>Course Name</th>
					<th>Level</th>
					<th>Start Date</th>
					<th>Months</th>
					<th>Status</th>
					<th class="text-end">Fees</th>
					<th class="text-end">Available Seat</th>
					<th class="text-end">Registrations</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${list}">
					<td th:text="${item.courseName}">Java Basic</td>
					<td th:text="${item.courseLevel}">Basic</td>
					<td th:text="${item.startDate}">2026/5/15</td>
					<td th:text="${item.months}">Months</td>
					<td th:text="${item.status}">Start</td>
					<td th:text="${item.fees}" class="text-end">300,000 MMK</td>
					<td th:text="${item.availableSeats}" class="text-end">30</td>
					<td th:text="${item.registrations}" class="text-end">26</td>
					<td class="text-center">
						<a th:href="@{|/classes/${item.id}|}" class="btn-link">
							<i class="bi-arrow-right"></i>
						</a>
					</td>
				</tr>
			</tbody>
		</table>
		
		<div th:if="${#lists.isEmpty(list)}" th:insert="~{/fragments/component :: nodata('Classes')}"></div>
		
	</main>
</body>
</html>
