<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/fragments/layout :: html(content=~{::main})}">
<head>
<meta charset="UTF-8">
</head>
<body>
	
	<main>
		<h3>Class Edit</h3>
		
		<form method="post" th:action="@{/classes/edit}">
			<div class="row mb-3">
				<div class="col-3">
					<label class="form-label">Course</label>
					<select class="form-select">
						<option value="">Select Course</option>
						<option th:each="item : ${courses}" th:value="${item.id}">[[${item.name}]]</option>
					</select>
				</div>
				
				<div class="col-3">
					<label class="form-label">Start Date</label>
					<input type="date" class="form-control" />
				</div>
			</div>
			
			<div class="row mb-3">
				<div class="col-3">
					<label class="form-label">Fees</label>
					<input type="number" class="form-control" />
				</div>
				
				<div class="col-3">
					<label class="form-label">Available Seats</label>
					<input type="number" class="form-control" />
				</div>				
			</div>
			
			<section>
				<h5>Schedules</h5>
				
				<div class="row mb-3">
					<div class="col-3">
						<label class="form-label">Day of Week</label>
						<select class="form-select">
							<option value="">Select One</option>
						</select>
					</div>
					
					<div class="col-3">
						<label class="form-label">Start Time</label>
						<input type="time" class="form-control" />
					</div>

					<div class="col-3">
						<label class="form-label">End Time</label>
						<input type="time" class="form-control" />
					</div>
					
					<div class="col-auto btn-wrapper">
						<button class="btn btn-outline-danger">
							<i class="bi-trash"></i>
						</button>
					</div>
				</div>
				
				<div>
					<button type="submit" class="btn btn-primary">
						<i class="bi-save"></i> Save Class
					</button>
					
					<button type="button" class="btn btn-outline-primary">
						<i class="bi-plus"></i> Add Schedule
					</button>
				</div>
			</section>
		</form>
	</main>
</body>
</html>
